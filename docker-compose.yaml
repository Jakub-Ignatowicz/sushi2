networks:
  sushinet:
    driver: bridge

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - sushinet

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://192.168.88.103:3000/api
    depends_on:
      - backend
    networks:
      - sushinet

  db:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    networks:
      - sushinet

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - frontend
      - backend
    networks:
      - sushinet

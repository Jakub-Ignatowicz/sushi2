networks:
  sushinet:
    driver: bridge

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "5152:5152"
    depends_on:
      - db
    networks:
      - sushinet

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:5152"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sushinet

  db:
    image: postgres
    environment:
      POSTGRES_USER: kawre
      POSTGRES_PASSWORD: cwel
      POSTGRES_DB: sushizume-dev
    ports:
      - "5433:5432"
    networks:
      - sushinet

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
    depends_on:
      - frontend
      - backend
    networks:
      - sushinet

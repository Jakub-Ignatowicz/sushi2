networks:
  sushinet:
    driver: bridge

services:
  backend:
    build: ./backend
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    depends_on:
      - db
    volumes:
      - ${HOME}/static:/app/wwwroot
    networks:
      - sushinet

  frontend:
    build:
      context: ./frontend
      args:
        HOST_URL: ${HOST_URL}
    depends_on:
      - backend
    networks:
      - sushinet

  db:
    image: postgres:17.5-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ${HOME}/postgres-data:/var/lib/postgresql/data
    networks:
      - sushinet

  nginx:
    image: nginx:1.29.0-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - frontend
      - backend
    networks:
      - sushinet

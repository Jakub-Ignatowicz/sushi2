networks:
  sushinet:
    driver: bridge

services:
  backend:
    build: ./backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - db
    volumes:
      - /home/dev/static:/app/wwwroot
    networks:
      - sushinet

  frontend:
    build:
      context: ./frontend
      args:
        HOST_URL: http://161.35.212.253
    depends_on:
      - backend
    networks:
      - sushinet

  db:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # ports:
    #   - "5432:5432"
    volumes:
      - /home/dev/postgres-data:/var/lib/postgresql/data
    networks:
      - sushinet

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # ports:
    #   - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - sushinet

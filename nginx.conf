events {}

http {
	upstream frontend {
		server frontend:3000;
	}

	upstream backend {
		server backend:5152;
	}

	server {
		listen 443 ssl;
		server_name test.sushizume.pl;
		
		ssl_certificate /etc/letsencrypt/live/test.sushizume.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.sushizume.pl/privkey.pem;
		
		client_max_body_size 5M;

		location / {
			proxy_pass http://frontend/;
		}
		
		location /images {
			proxy_pass http://backend/images;
		}

		location /api/ {
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' 'https://test.sushizume.pl';
				add_header 'Access-Control-Allow-Credentials' 'true';
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
				add_header 'Access-Control-Allow-Headers' "$http_access_control_request_headers";
				
				add_header 'Access-Control-Max-Age' 1728000;
				add_header 'Content-Length' 0;
				add_header 'Content-Type' 'text/plain; charset=UTF-8';
				
				return 204;
			}

			add_header 'Access-Control-Allow-Origin' 'https://test.sushizume.pl' always;
			add_header 'Access-Control-Allow-Credentials' 'true' always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
		  add_header 'Access-Control-Allow-Headers' "$http_access_control_request_headers";

			proxy_pass http://backend/api/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}
}

name: Deploy Template

# on:
#   workflow_call:
#     inputs:
#       environment:
#         required: true
#         type: string
#       stage:
#         required: true
#         type: string
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      STAGE: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Sync files to VPS
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete
          path: ./
          remote_path: /home/${{ secrets.VPS_USER }}/app
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Run scripts and deploy on VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/app
            export POSTGRES_USER="${{ vars.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export POSTGRES_DB="${{ vars.POSTGRES_DB }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export JWT_EXPIRY_MINUTES="${{ vars.JWT_EXPIRY_MINUTES }}"
            export JWT_REFRESH_EXPIRY_DAYS="${{ vars.JWT_REFRESH_EXPIRY_DAYS }}"
            export CONNECTION_STRINGS_DEFAULT_CONN="${{ secrets.CONNECTION_STRINGS_DEFAULT_CONN }}"
            export CONNECTION_STRINGS_SOURCE_CONN="${{ secrets.CONNECTION_STRINGS_SOURCE_CONN }}"
            chmod +x .github/scripts/set-secrets.sh
            chmod +x .github/scripts/deploy.sh
            bash .github/scripts/set-secrets.sh
            bash .github/scripts/deploy.sh
